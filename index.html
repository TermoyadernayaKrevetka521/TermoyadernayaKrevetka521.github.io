<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Вход и регистрация</title>
  </head>
  <body>
    <h2>Регистрация</h2>
    <form id="signup-form">
      <input name="name" type="text" placeholder="Имя" required />
      <input name="email" type="email" placeholder="Email" autocomplete="email" required />
      <input
        name="password"
        type="password"
        placeholder="Пароль"
        autocomplete="new-password"
        required
      />
      <button type="submit">Зарегистрироваться</button>
    </form>

    <h2>Вход</h2>
    <form id="signin-form">
      <input name="email" type="email" placeholder="Email" autocomplete="email" required />
      <input
        name="password"
        type="password"
        placeholder="Пароль"
        autocomplete="current-password"
        required
      />
      <button type="submit">Войти</button>
    </form>

    <button id="signout-button" type="button" hidden>Выйти</button>
    <p id="status"></p>

    <script type="module">
      import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

      const supabase = createClient(
        'https://gkvlrqsamgdkzaxgrgax.supabase.co',
        'sb_publishable_GPnjmVLdy-rQ-I6TJxHu2w_ATkXCpNO'
      )

      const status = document.querySelector('#status')
      const signoutButton = document.querySelector('#signout-button')

      function showSession(session) {
        if (session) {
          status.textContent = `Вы вошли как ${session.user.email}`
          signoutButton.hidden = false
        } else {
          signoutButton.hidden = true
        }
      }

      // Регистрация
      document.querySelector('#signup-form').addEventListener('submit', async (event) => {
        event.preventDefault()

        const values = new FormData(event.currentTarget)
        const name = String(values.get('name')).trim()
        const email = String(values.get('email')).trim()
        const password = String(values.get('password'))

        const { data, error } = await supabase.auth.signUp({
          email,
          password,
          options: {
            data: { name }
          }
        })

        if (error) {
          status.textContent = `Ошибка регистрации: ${error.message}`
          return
        }

        if (data.session) {
          showSession(data.session)
        } else {
          status.textContent = 'Регистрация создана. Проверь почту и перейди по ссылке подтверждения.'
        }
      })

      // Вход
      document.querySelector('#signin-form').addEventListener('submit', async (event) => {
        event.preventDefault()

        const values = new FormData(event.currentTarget)
        const email = String(values.get('email')).trim()
        const password = String(values.get('password'))

        const { data, error } = await supabase.auth.signInWithPassword({
          email,
          password
        })

        if (error) {
          status.textContent = `Ошибка входа: ${error.message}`
          return
        }

        window.location.assign('welcome.html')
      })

      // Выход
      signoutButton.addEventListener('click', async () => {
        const { error } = await supabase.auth.signOut()

        if (error) {
          status.textContent = `Ошибка выхода: ${error.message}`
          return
        }

        status.textContent = 'Вы вышли из аккаунта.'
      })

      // Показываем уже существующую сессию и следим за изменениями
      const { data } = await supabase.auth.getSession()
      showSession(data.session)

      supabase.auth.onAuthStateChange((_event, session) => {
        showSession(session)
      })
    </script>
  </body>
</html>
